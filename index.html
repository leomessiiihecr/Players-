<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تصنيف لاعبي كرة القدم</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfc6ad;--paper:#ede6d8;--ink:#2b2620;--cell:#e6dfd1;--line:#c9bfa8;--sel:#1d9bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;padding:8px}
.board{background:var(--paper);border-radius:18px;padding:12px;max-width:680px;margin:0 auto;box-shadow:0 6px 24px #0002}
#capture{background:var(--paper);padding:14px 10px 10px;border-radius:12px}
header{text-align:center;margin-bottom:10px}
h1{font-family:'Aref Ruqaa',serif !important;font-size:34px;font-weight:700;margin:0;line-height:1.2;color:#231f1a}
.sub{font-size:11px;font-weight:700;color:#6e6555;margin-top:4px;letter-spacing:1px}
.grid-wrap{border:1px solid var(--line);background:var(--line);display:flex;flex-direction:column;gap:1px}
.row{display:flex;gap:1px;background:var(--line)}
.lab{width:68px;flex:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 2px}
.lab b{font-size:20px;font-weight:800;line-height:1.1;letter-spacing:.5px;font-family:Georgia,serif}
.lab small{font-size:10px;font-weight:700;opacity:.92;margin-top:2px}
.cells{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line)}
.cell{background:var(--cell);min-height:84px;display:flex;align-items:center;justify-content:center;min-width:0;padding:3px}
.cell.big{grid-column:span 3;min-height:90px}
.cell.hot{outline:2px dashed var(--sel);z-index:2}
.bank{margin-top:12px;background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-height:82px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:100%;padding:1px;touch-action:none;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:scale(1.1)}
.av{width:100%;max-width:54px;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;box-shadow:0 2px 5px #0002;border:1.5px solid #fff}
.big .av{max-width:62px}
.card span{font-size:9.5px;font-weight:700;text-align:center;line-height:1.15;color:#2b2620}
.big .card span,.bank .card span{font-size:11px}
.footer-cap{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 4px;font-size:11px;font-weight:700;color:#5a5245;direction:ltr}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;gap:6px}
.btns{display:flex;gap:6px}
button.btn{border:0;background:#2b2620;color:#ede6d8;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:700;cursor:pointer}
button.save{background:#5d7a58;color:#fff}
</style>
</head>
<body>
<div class="board">
<div id="capture">
<header>
<h1>تصنيف لاعبي كرة القدم</h1>
<div class="sub">١٤ أسطورة • مرتبون حسب المكانة</div>
</header>
<div class="grid-wrap" id="rows"></div>
<div class="footer-cap">
<span>X: Witvw</span>
<span>All design rights reserved</span>
</div>
</div>
<div class="bank" id="bank"></div>
<div class="tools">
<span>اسحب اللاعب وأفلته في الخانة</span>
<div class="btns">
<button class="btn save" id="save">حفظ كصورة</button>
<button class="btn" id="reset">إعادة</button>
</div>
</div>
</div>
<script src="https://cloudflare.com"></script>
<script>
const P=[
  {id:"messi",name:"ليونيل ميسي",img:"photo/messi.jpg.JPEG"},
  {id:"mara",name:"دييغو مارادونا",img:"photo/maradona.jpg.JPG"},
  {id:"r9",name:"رونالدو نازاريو",img:"photo/ronaldo.jpg.JPG"},
  {id:"cr7",name:"كريستيانو رونالدو",img:"photo/cr.jpg.JPG"},
  {id:"pele",name:"بيليه",img:"photo/pele.jpg.JPG"},
  {id:"cruyff",name:"يوهان كرويف",img:"photo/johan.jpg.JPG"},
  {id:"zidane",name:"زين الدين زيدان",img:"photo/ziedan.jpg.JPG"},
  {id:"beck",name:"فرانز بيكنباور",img:"photo/binkabowr.jpg.JPG"},
  {id:"difa",name:"ألفريدو دي ستيفانو",img:"photo/de.jpg.jpg"},
  {id:"r10",name:"رونالدينيو",img:"photo/rone.jpg.jpg"},
  {id:"neymar",name:"نيمار جونيور",img:"photo/ney.jpg.JPG"},
  {id:"iniesta",name:"أندريس إنيستا",img:"photo/in.jpg.jpg"},
  {id:"xavi",name:"تشافي هيرنانديز",img:"photo/xavi.jpg.JPG"},
  {id:"modric",name:"لوكا مودريتش",img:"photo/luka.jpg.JPG"}
];
const ROWS=[
  {code:"SSS",label:"الأفضل",color:"#8e5b53",count:2},
  {code:"SS",label:"لاعب كبير",color:"#b07850",count:6},
  {code:"S",label:"لاعب ممتاز",color:"#97915c",count:6}
];
const COL=["#7b5ea7","#c0603a","#3a7ca5","#4a8f6a","#b0488a","#a07d2a","#566","#a14"];
let pos={},photos={},sel=null;
P.forEach(p=>pos[p.id]="b");
const getP=id=>P.find(p=>p.id===id);
function card(id){
  const p=getP(id),ph=photos[id],idx=P.findIndex(x=>x.id===id);
  return `<div class="card${sel===id?' sel':''}" data-id="${id}"><div class="av" style="${ph?`background-image:url('${ph}')`:`background:${COL[idx%COL.length]}`}">${ph?'':p.name.charAt(0)}</div><span>${p.name}</span></div>`;
}
function render(){
  let s=0,h="";
  ROWS.forEach(r=>{
    h+=`<div class="row"><div class="lab" style="background:${r.color}"><b>${r.code}</b><small>${r.label}</small></div><div class="cells">`;
    for(let i=0;i<r.count;i++,s++){
      const id=Object.keys(pos).find(k=>pos[k]===s);
      h+=`<div class="cell${r.count===2?' big':''}" data-slot="${s}">${id?card(id):''}</div>`;
    }
    h+="</div></div>";
  });
  document.getElementById("rows").innerHTML=h;
  document.getElementById("bank").innerHTML=P.filter(p=>pos[p.id]==="b").map(p=>card(p.id)).join("");
}
document.addEventListener("click",e=>{
  const cell=e.target.closest(".cell");
  if(cell&&sel){pos[sel]=+cell.dataset.slot;sel=null;render();return}
  if(e.target.closest("#bank")&&sel){pos[sel]="b";sel=null;render()}
});
let drag=null;
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".card");if(!c)return;
  drag={id:c.dataset.id,x:e.clientX,y:e.clientY,g:null,el:c};
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.g){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    const g=drag.el.cloneNode(true);g.className="card ghost";g.style.width=drag.el.offsetWidth+"px";document.body.appendChild(g);drag.g=g;drag.el.style.opacity=.35;
  }
  drag.g.style.left=(e.clientX-drag.g.offsetWidth/2)+"px";drag.g.style.top=(e.clientY-drag.g.offsetHeight/2)+"px";
});
function endDrag(e,drop){
  if(!drag)return;const d=drag;drag=null;
  if(!d.g)return;d.g.remove();
  if(drop){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const tc=t&&t.closest(".card"),cell=t&&t.closest(".cell"),bank=t&&t.closest("#bank");
    if(tc&&tc.dataset.id!==d.id){const o=tc.dataset.id,tmp=pos[d.id];pos[d.id]=pos[o];pos[o]=tmp}
    else if(cell&&!tc)pos[d.id]=+cell.dataset.slot;
    else if(bank&&!tc)pos[d.id]="b";
  }
  render();
}
document.addEventListener("pointerup",e=>endDrag(e,true));
document.addEventListener("pointercancel",e=>endDrag(e,false));
document.getElementById("reset").onclick=()=>{P.forEach(p=>pos[p.id]="b");sel=null;render()};
document.getElementById("save").onclick=async()=>{
  const btn=document.getElementById("save");
  btn.textContent="جاري الحفظ...";
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(document.getElementById("capture"),{scale:2,useCORS:true,backgroundColor:"#ede6d8"});
    canvas.toBlob(async blob=>{
      const file=new File([blob],"Witvw-tierlist.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"تصنيف لاعبي كرة القدم"})}catch(e){}
      }else{
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.download="Witvw-tierlist.png";
        a.href=url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
      }
      btn.textContent="حفظ كصورة";
    },"image/png");
  }catch(e){
    btn.textContent="حفظ كصورة";
  }
};
P.forEach(p=>{
  const im=new Image();
  im.onload=()=>{photos[p.id]=p.img;render()};
  im.src=p.img;
});
render();
</script>
</body>
</html>
