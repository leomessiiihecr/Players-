<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تصنيف لاعبي كرة القدم</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#cfc6ad;--paper:#ede6d8;--ink:#2b2620;--cell:#e6dfd1;--line:#c9bfa8;--sel:#1d9bf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;padding:8px}
.board{background:var(--paper);border-radius:18px;padding:12px;max-width:680px;margin:0 auto;box-shadow:0 6px 24px #0002}
h1{font-family:'Aref Ruqaa',serif;font-size:34px;text-align:center;margin:4px 0 12px;color:#231f1a}
.grid-wrap,.row,.cells{display:flex;gap:1px;background:var(--line)}
.grid-wrap{border:1px solid var(--line);flex-direction:column}
.lab{width:68px;flex:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 2px}
.lab b{font-size:20px;font-weight:800;font-family:Georgia,serif}
.lab small{font-size:10px;margin-top:2px}
.cells{flex:1;display:grid;grid-template-columns:repeat(6,1fr)}
.cell{background:var(--cell);min-height:92px;display:flex;align-items:center;justify-content:center;padding:4px 2px}
.cell.big{grid-column:span 3;min-height:96px}
.bank{margin-top:12px;background:var(--cell);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-height:82px}
.card{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:scale(1.1)}
.av{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;border:1.5px solid #fff;box-shadow:0 2px 5px #0002}
.big .av{max-width:62px}
.card span{font-size:9.5px;text-align:center;line-height:1.15}
.big .card span,.bank .card span{font-size:11px}
.foot{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px;font-size:11px;color:#5a5245;direction:ltr}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px}
button{border:0;background:#2b2620;color:#ede6d8;border-radius:12px;padding:8px 16px;font-family:inherit;font-weight:700;cursor:pointer}
button.save{background:#5d7a58;color:#fff;margin-inline-end:6px}
</style>
</head>
<body>
<div class="board">
<h1>تصنيف لاعبي كرة القدم</h1>
<div class="grid-wrap" id="rows"></div>
<div class="foot"><span>X: Witvw</span><span>All design rights reserved</span></div>
<div class="bank" id="bank"></div>
<div class="tools">
<span>اسحب اللاعب وأفلته في الخانة</span>
<div><button type="button" class="save" id="save">حفظ كصورة</button><button type="button" id="reset">إعادة</button></div>
</div>
</div>
<script>
const P=[
 {id:"messi",name:"ليونيل ميسي",img:"photo/messi.jpg.JPEG"},
 {id:"mara",name:"دييغو مارادونا",img:"photo/maradona.jpg.JPG"},
 {id:"r9",name:"رونالدو نازاريو",img:"photo/ronaldo.jpg.JPG"},
 {id:"cr7",name:"كريستيانو رونالدو",img:"photo/cr.jpg.JPG"},
 {id:"pele",name:"بيليه",img:"photo/pele.jpg.JPG"},
 {id:"cruyff",name:"يوهان كرويف",img:"photo/johan.jpg.JPG"},
 {id:"zidane",name:"زين الدين زيدان",img:"photo/ziedan.jpg.JPG"},
 {id:"beck",name:"فرانز بيكنباور",img:"photo/binkabowr.jpg.JPG"},
 {id:"difa",name:"ألفريدو دي ستيفانو",img:"photo/de.jpg.jpg"},
 {id:"r10",name:"رونالدينيو",img:"photo/rone.jpg.jpg"},
 {id:"neymar",name:"نيمار جونيور",img:"photo/ney.jpg.JPG"},
 {id:"iniesta",name:"أندريس إنيستا",img:"photo/in.jpg.jpg"},
 {id:"xavi",name:"تشافي هيرنانديز",img:"photo/xavi.jpg.JPG"},
 {id:"modric",name:"لوكا مودريتش",img:"photo/luka.jpg.JPG"}
];
const R=[
 {code:"SSS",label:"الأفضل",color:"#8e5b53",count:2},
 {code:"SS",label:"لاعب كبير",color:"#b07850",count:6},
 {code:"S",label:"لاعب ممتاز",color:"#97915c",count:6}
];
let pos={},imgs={},drag=null;
P.forEach(p=>{pos[p.id]="b";const im=new Image();im.onload=()=>{imgs[p.id]=im;render()};im.src=p.img});
const card=p=>`<div class="card" data-id="${p.id}"><div class="av" style="background-image:url('${p.img}')"></div><span>${p.name}</span></div>`;
function render(){
 let s=0,h="";
 R.forEach(r=>{
  h+=`<div class="row"><div class="lab" style="background:${r.color}"><b>${r.code}</b><small>${r.label}</small></div><div class="cells">`;
  for(let i=0;i<r.count;i++,s++){const id=Object.keys(pos).find(k=>pos[k]===s);h+=`<div class="cell${r.count==2?' big':''}" data-slot="${s}">${id?card(P.find(x=>x.id==id)):''}</div>`;}
  h+="</div></div>";
 });
 rows.innerHTML=h;bank.innerHTML=P.filter(p=>pos[p.id]==="b").map(card).join("");
}
document.addEventListener("pointerdown",e=>{const c=e.target.closest(".card");if(c)drag={id:c.dataset.id,x:e.clientX,y:e.clientY,el:c}});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.g=drag.el.cloneNode(true);drag.g.className="card ghost";drag.g.style.width=drag.el.offsetWidth+"px";document.body.appendChild(drag.g);drag.el.style.opacity=.35}
 if(drag.g){drag.g.style.left=(e.clientX-drag.g.offsetWidth/2)+"px";drag.g.style.top=(e.clientY-drag.g.offsetHeight/2)+"px"}
});
document.addEventListener("pointerup",e=>{
 if(!drag)return;const d=drag;drag=null;if(!d.g)return;d.g.remove();
 const t=document.elementFromPoint(e.clientX,e.clientY),tc=t&&t.closest(".card"),cell=t&&t.closest(".cell"),bk=t&&t.closest("#bank");
 if(tc&&tc.dataset.id!==d.id){[pos[d.id],pos[tc.dataset.id]]=[pos[tc.dataset.id],pos[d.id]]}
 else if(cell&&!tc)pos[d.id]=+cell.dataset.slot;
 else if(bk&&!tc)pos[d.id]="b";
 render();
});
reset.onclick=()=>{P.forEach(p=>pos[p.id]="b");render()};
save.onclick=async()=>{
 save.textContent="جاري الحفظ...";await document.fonts.ready;
 const W=1080,pad=36,hh=100,rh=185,fh=50,H=pad*2+hh+rh*3+fh,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 c.fillStyle="#ede6d8";c.fillRect(0,0,W,H);c.fillStyle="#231f1a";c.font="700 54px 'Aref Ruqaa',serif";c.textAlign="center";c.textBaseline="middle";c.fillText("تصنيف لاعبي كرة القدم",W/2,pad+45);
 const gx=pad,gy=pad+hh,gw=W-pad*2,lw=125,cw0=gw-lw;c.fillStyle="#c9bfa8";c.fillRect(gx-2,gy-2,gw+4,rh*3+4);
 let s=0;
 R.forEach((r,ri)=>{
  const ry=gy+ri*rh,lx=gx+cw0;c.fillStyle=r.color;c.fillRect(lx,ry,lw,rh-2);c.fillStyle="#fff";c.font="800 32px Georgia";c.fillText(r.code,lx+lw/2,ry+rh/2-16);c.font="700 18px Cairo";c.fillText(r.label,lx+lw/2,ry+rh/2+20);
  const cw=cw0/r.count;
  for(let ci=0;ci<r.count;ci++,s++){
   const cx=gx+cw0-(ci+1)*cw;c.fillStyle="#e6dfd1";c.fillRect(cx+1,ry,cw-2,rh-2);
   const pid=Object.keys(pos).find(k=>pos[k]===s);
   if(pid){
    const p=P.find(x=>x.id==pid),rad=r.count==2?46:38,ix=cx+cw/2,iy=ry+rad+20,im=imgs[pid];
    c.save();c.beginPath();c.arc(ix,iy,rad,0,7);c.clip();if(im){const m=Math.min(im.width,im.height);c.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,ix-rad,iy-rad,rad*2,rad*2)}c.restore();
    c.beginPath();c.arc(ix,iy,rad,0,7);c.lineWidth=3;c.strokeStyle="#fff";c.stroke();
    c.fillStyle="#2b2620";c.font=r.count==2?"700 19px Cairo":"700 15px Cairo";
    const w=p.name.split(" ");let l="",ls=[];w.forEach(x=>{let t=l?l+" "+x:x;if(c.measureText(t).width>cw-10&&l){ls.push(l);l=x}else l=t});ls.push(l);ls.forEach((x,i)=>c.fillText(x,ix,iy+rad+24+i*19));
   }
  }
 });
 c.fillStyle="#5a5245";c.font="700 19px Cairo";c.textAlign="left";c.fillText("X: Witvw",gx+6,gy+rh*3+28);c.textAlign="right";c.fillText("All design rights reserved",gx+gw-6,gy+rh*3+28);
 cv.toBlob(async b=>{
  const f=new File([b],"Witvw.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement("a");a.download="Witvw.png";a.href=URL.createObjectURL(b);a.click()}
  save.textContent="حفظ كصورة";
 });
};
render();
</script>
</body>
</html>
