<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة بطولة الأساطير</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#cfc6ad;--paper:#ede6d8;--ink:#2b2620;--slot:#e2d9c6;--line:#8e5b53;--gold:#a07d2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;padding:8px}
.board{background:var(--paper);border-radius:20px;padding:12px 8px;max-width:600px;margin:0 auto;box-shadow:0 6px 24px #0002;text-align:center}
h1{font-family:'Aref Ruqaa',serif;font-size:32px;margin:0 0 4px;color:#231f1a}
.sub{font-size:11px;color:#6e6555;margin-bottom:12px}
.bracket{position:relative;width:100%;aspect-ratio:1/1.05;max-height:540px;margin:0 auto;direction:ltr}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.lines path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2;transition:transform .15s}
.node:active{transform:translate(-50%,-50%) scale(.92)}
.av{width:46px;height:46px;border-radius:50%;background-color:var(--slot);background-size:cover;background-position:center;border:2.5px solid #fff;box-shadow:0 3px 8px #0002;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#8c8270}
.sf .av{width:50px;height:50px;border-color:#b07850}
.fin .av{width:54px;height:54px;border-color:#8e5b53}
.win .av{width:68px;height:68px;border:3.5px solid var(--gold);box-shadow:0 0 18px #a07d2a66}
.node span{font-size:9.5px;font-weight:800;background:#ede6d8e6;padding:1px 5px;border-radius:6px;margin-top:2px;white-space:nowrap;color:#231f1a}
.win span{background:var(--gold);color:#fff;font-size:11px;padding:2px 8px}
.tools{margin-top:12px;display:flex;justify-content:center;gap:8px}
button{border:0;background:#2b2620;color:#ede6d8;border-radius:14px;padding:9px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
button.save{background:#5d7a58;color:#fff}
</style>
</head>
<body>
<div class="board">
<h1>بطولة الأساطير</h1>
<div class="sub">اضغط على اللاعب الفائز في كل مواجهة ليتأهل للنهائي</div>
<div class="bracket" id="bracket"></div>
<div class="tools">
<button type="button" class="save" id="save">حفظ الشجرة كصورة</button>
<button type="button" onclick="init()">تغيير اللاعبين</button>
</div>
</div>
<script>
const P=[
 {id:"messi",name:"ميسي",img:"photo/messi.jpg.JPEG"},
 {id:"mara",name:"مارادونا",img:"photo/maradona.jpg.JPG"},
 {id:"r9",name:"الظاهرة R9",img:"photo/ronaldo.jpg.JPG"},
 {id:"cr7",name:"كريستيانو",img:"photo/cr.jpg.JPG"},
 {id:"pele",name:"بيليه",img:"photo/pele.jpg.JPG"},
 {id:"cruyff",name:"كرويف",img:"photo/johan.jpg.JPG"},
 {id:"zidane",name:"زيدان",img:"photo/ziedan.jpg.JPG"},
 {id:"beck",name:"بيكنباور",img:"photo/binkabowr.jpg.JPG"},
 {id:"difa",name:"دي ستيفانو",img:"photo/de.jpg.jpg"},
 {id:"r10",name:"رونالدينيو",img:"photo/rone.jpg.jpg"},
 {id:"neymar",name:"نيمار",img:"photo/ney.jpg.JPG"},
 {id:"iniesta",name:"إنيستا",img:"photo/in.jpg.jpg"},
 {id:"xavi",name:"تشافي",img:"photo/xavi.jpg.JPG"},
 {id:"modric",name:"مودريتش",img:"photo/luka.jpg.JPG"}
];
const POS=[
 {x:11,y:14,c:"qf"},{x:11,y:38,c:"qf"},{x:11,y:62,c:"qf"},{x:11,y:86,c:"qf"},
 {x:89,y:14,c:"qf"},{x:89,y:38,c:"qf"},{x:89,y:62,c:"qf"},{x:89,y:86,c:"qf"},
 {x:30,y:26,c:"sf"},{x:30,y:74,c:"sf"},
 {x:70,y:26,c:"sf"},{x:70,y:74,c:"sf"},
 {x:42,y:50,c:"fin"},{x:58,y:50,c:"fin"},
 {x:50,y:23,c:"win"}
];
const NEXT={0:8,1:8,2:9,3:9,4:10,5:10,6:11,7:11,8:12,9:12,10:13,11:13,12:14,13:14};
let slots=[],imgs={};
P.forEach(p=>{const im=new Image();im.onload=()=>imgs[p.id]=im;im.src=p.img});

function init(){
 const sh=[...P].sort(()=>Math.random()-.5).slice(0,8);
 slots=Array(15).fill(null);
 for(let i=0;i<8;i++)slots[i]=sh[i];
 draw();
}
function pick(i){
 if(!slots[i]||i===14)return;
 const nxt=NEXT[i];
 slots[nxt]=slots[i];
 if(nxt<12){slots[NEXT[nxt]]=null;slots[14]=null;}
 else if(nxt<14){slots[14]=null;}
 draw();
}
function draw(){
 const lines=`<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">
  <path d="M11,14 H21 V38 H11 M21,26 H30"/>
  <path d="M11,62 H21 V86 H11 M21,74 H30"/>
  <path d="M89,14 H79 V38 H89 M79,26 H70"/>
  <path d="M89,62 H79 V86 H89 M79,74 H70"/>
  <path d="M30,26 V74 M30,50 H42"/>
  <path d="M70,26 V74 M70,50 H58"/>
  <path d="M42,50 H58 M50,50 V23"/>
 </svg>`;
 let nodes="";
 POS.forEach((pt,i)=>{
  const p=slots[i];
  const st=p?`background-image:url('${p.img}')`:"";
  const lbl=i===14?(p?`🏆 ${p.name}`:"البطل"):(p?p.name:"");
  nodes+=`<div class="node ${pt.c}" style="left:${pt.x}%;top:${pt.y}%" onclick="pick(${i})"><div class="av" style="${st}">${p?"":"?"}</div>${lbl?`<span>${lbl}</span>`:""}</div>`;
 });
 bracket.innerHTML=lines+nodes;
}
save.onclick=async()=>{
 save.textContent="جاري الحفظ...";await document.fonts.ready;
 const W=1000,H=1080,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 c.fillStyle="#ede6d8";c.fillRect(0,0,W,H);
 c.fillStyle="#231f1a";c.font="700 56px 'Aref Ruqaa',serif";c.textAlign="center";c.fillText("بطولة الأساطير",W/2,75);
 const ox=40,oy=130,bw=W-80,bh=H-170;
 const px=x=>ox+(x/100)*bw,py=y=>oy+(y/100)*bh;
 c.strokeStyle="#8e5b53";c.lineWidth=5;c.globalAlpha=.55;
 const segs=[
  [[11,14],[21,14],[21,38],[11,38]],[[21,26],[30,26]],
  [[11,62],[21,62],[21,86],[11,86]],[[21,74],[30,74]],
  [[89,14],[79,14],[79,38],[89,38]],[[79,26],[70,26]],
  [[89,62],[79,62],[79,86],[89,86]],[[79,74],[70,74]],
  [[30,26],[30,74]],[[30,50],[42,50]],
  [[70,26],[70,74]],[[70,50],[58,50]],
  [[42,50],[58,50]],[[50,50],[50,23]]
 ];
 segs.forEach(s=>{c.beginPath();c.moveTo(px(s[0][0]),py(s[0][1]));s.slice(1).forEach(pt=>c.lineTo(px(pt[0]),py(pt[1])));c.stroke()});
 c.globalAlpha=1;
 POS.forEach((pt,i)=>{
  const p=slots[i],ix=px(pt.x),iy=py(pt.y),rad=i===14?58:(i>=12?44:(i>=8?40:37));
  c.save();c.beginPath();c.arc(ix,iy,rad,0,7);c.clip();
  c.fillStyle="#e2d9c6";c.fillRect(ix-rad,iy-rad,rad*2,rad*2);
  if(p&&imgs[p.id]){const im=imgs[p.id],m=Math.min(im.width,im.height);c.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,ix-rad,iy-rad,rad*2,rad*2)}
  c.restore();
  c.beginPath();c.arc(ix,iy,rad,0,7);c.lineWidth=i===14?6:4;c.strokeStyle=i===14?"#a07d2a":"#fff";c.stroke();
  if(p){
   c.fillStyle=i===14?"#a07d2a":"#231f1a";c.font=i===14?"800 22px Cairo":"800 17px Cairo";
   c.fillText(i===14?`🏆 ${p.name}`:p.name,ix,iy+rad+22);
  }
 });
 cv.toBlob(async b=>{
  const f=new File([b],"bracket.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement("a");a.download="bracket.png";a.href=URL.createObjectURL(b);a.click()}
  save.textContent="حفظ الشجرة كصورة";
 });
};
init();
</script>
</body>
</html>
