<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطولة الأساطير • خروج المغلوب</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{--bg:#cfc6ad;--paper:#ede6d8;--ink:#2b2620;--card:#e6dfd1;--line:#c9bfa8;--gold:#a07d2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;padding:10px}
.board{background:var(--paper);border-radius:22px;padding:16px;max-width:540px;margin:0 auto;box-shadow:0 6px 24px #0002;text-align:center}
h1{font-family:'Aref Ruqaa',serif;font-size:32px;margin:0 0 6px;color:#231f1a}
.badge{display:inline-block;background:#8e5b53;color:#fff;padding:4px 16px;border-radius:20px;font-size:13px;font-weight:800;margin-bottom:4px}
.sub{font-size:12px;color:#6e6555;margin-bottom:14px}
.arena{display:flex;flex-direction:column;gap:10px;align-items:center}
.player{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,border-color .15s;user-select:none}
.player:active{transform:scale(.97);border-color:#8e5b53}
.av{width:84px;height:84px;border-radius:50%;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:0 4px 10px #0002;flex:none}
.info{text-align:right;flex:1}
.info b{font-size:19px;display:block;color:#231f1a}
.info span{font-size:12px;color:#6e6555}
.vs{width:44px;height:44px;border-radius:50%;background:#2b2620;color:#ede6d8;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:800;font-size:16px;margin:-6px 0;z-index:2;border:3px solid var(--paper)}
.champ{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:24px 16px;margin:10px 0}
.champ .av{width:130px;height:130px;margin:0 auto 12px;border:4px solid var(--gold)}
.champ h2{margin:0;font-size:24px;color:#231f1a}
.champ p{margin:4px 0 0;font-size:13px;color:var(--gold)}
.tools{margin-top:16px;display:flex;justify-content:center;gap:8px}
button{border:0;background:#2b2620;color:#ede6d8;border-radius:14px;padding:10px 20px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
button.save{background:#5d7a58;color:#fff}
</style>
</head>
<body>
<div class="board">
<h1>بطولة الأساطير</h1>
<div id="app"></div>
<div class="tools" id="tools"></div>
</div>
<script>
const P=[
 {id:"messi",name:"ليونيل ميسي",img:"photo/messi.jpg.JPEG"},
 {id:"mara",name:"دييغو مارادونا",img:"photo/maradona.jpg.JPG"},
 {id:"r9",name:"رونالدو نازاريو",img:"photo/ronaldo.jpg.JPG"},
 {id:"cr7",name:"كريستيانو رونالدو",img:"photo/cr.jpg.JPG"},
 {id:"pele",name:"بيليه",img:"photo/pele.jpg.JPG"},
 {id:"cruyff",name:"يوهان كرويف",img:"photo/johan.jpg.JPG"},
 {id:"zidane",name:"زين الدين زيدان",img:"photo/ziedan.jpg.JPG"},
 {id:"beck",name:"فرانز بيكنباور",img:"photo/binkabowr.jpg.JPG"},
 {id:"difa",name:"ألفريدو دي ستيفانو",img:"photo/de.jpg.jpg"},
 {id:"r10",name:"رونالدينيو",img:"photo/rone.jpg.jpg"},
 {id:"neymar",name:"نيمار جونيور",img:"photo/ney.jpg.JPG"},
 {id:"iniesta",name:"أندريس إنيستا",img:"photo/in.jpg.jpg"},
 {id:"xavi",name:"تشافي هيرنانديز",img:"photo/xavi.jpg.JPG"},
 {id:"modric",name:"لوكا مودريتش",img:"photo/luka.jpg.JPG"}
];
let imgs={},round=[],next=[],idx=0,champ=null;
P.forEach(p=>{const im=new Image();im.onload=()=>imgs[p.id]=im;im.src=p.img});

function start(){
 const sh=[...P].sort(()=>Math.random()-.5);
 round=sh.slice(0,12);
 next=sh.slice(12);
 idx=0;champ=null;render();
}
function stageName(){
 const total=round.length+next.length;
 if(total>8)return "الدور التمهيدي";
 if(total===8)return "ربع النهائي";
 if(total===4)return "نصف النهائي";
 return "المباراة النهائية";
}
function pick(p){
 next.push(p);
 idx+=2;
 if(idx>=round.length){
  if(next.length===1){champ=next[0];}
  else{round=[...next];next=[];idx=0;}
 }
 render();
}
function render(){
 if(champ){
  app.innerHTML=`<div class="badge">بطل البطولة</div><div class="champ"><div class="av" style="background-image:url('${champ.img}')"></div><h2>${champ.name}</h2><p>الأفضل في التاريخ باختيارك</p></div>`;
  tools.innerHTML=`<button type="button" class="save" onclick="saveImg()">حفظ البطل كصورة</button><button type="button" onclick="start()">بطولة جديدة</button>`;
  return;
 }
 const p1=round[idx],p2=round[idx+1],mNum=(idx/2)+1,mTotal=round.length/2;
 app.innerHTML=`<div class="badge">${stageName()}</div><div class="sub">المواجهة ${mNum} من ${mTotal} • اضغط على اللاعب الأفضل</div><div class="arena"><div class="player" onclick='pick(${JSON.stringify(p1)})'><div class="av" style="background-image:url('${p1.img}')"></div><div class="info"><b>${p1.name}</b><span>اضغط للتأهل</span></div></div><div class="vs">VS</div><div class="player" onclick='pick(${JSON.stringify(p2)})'><div class="av" style="background-image:url('${p2.img}')"></div><div class="info"><b>${p2.name}</b><span>اضغط للتأهل</span></div></div></div>`;
 tools.innerHTML=`<button type="button" onclick="start()">إعادة خلط اللاعبين</button>`;
}
async function saveImg(){
 await document.fonts.ready;
 const W=800,H=900,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 c.fillStyle="#ede6d8";c.fillRect(0,0,W,H);
 c.strokeStyle="#a07d2a";c.lineWidth=8;c.strokeRect(30,30,W-60,H-60);
 c.fillStyle="#231f1a";c.font="700 58px 'Aref Ruqaa',serif";c.textAlign="center";c.fillText("بطل الأساطير",W/2,130);
 const im=imgs[champ.id],rad=170,ix=W/2,iy=400;
 c.save();c.beginPath();c.arc(ix,iy,rad,0,7);c.clip();
 if(im){const m=Math.min(im.width,im.height);c.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,ix-rad,iy-rad,rad*2,rad*2)}
 c.restore();
 c.beginPath();c.arc(ix,iy,rad,0,7);c.lineWidth=8;c.strokeStyle="#a07d2a";c.stroke();
 c.fillStyle="#231f1a";c.font="800 46px Cairo";c.fillText(champ.name,W/2,650);
 c.fillStyle="#8e5b53";c.font="700 28px Cairo";c.fillText("الأفضل في التاريخ",W/2,715);
 cv.toBlob(async b=>{
  const f=new File([b],"champion.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement("a");a.download="champion.png";a.href=URL.createObjectURL(b);a.click()}
 });
}
start();
</script>
</body>
</html>
