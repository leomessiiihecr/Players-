<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تصنيف لاعبي كرة القدم</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cloudflare.com"></script>
<style>
:root{--bg:#cfc6ad;--paper:#ede6d8;--ink:#2b2620;--cell:#e4dccb;--line:#cbc1aa;--sel:#1d9bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a16;--paper:#2a2620;--ink:#f1e9d8;--cell:#38332a;--line:#4a4336}}
:root[data-theme="dark"]{--bg:#1c1a16;--paper:#2a2620;--ink:#f1e9d8;--cell:#38332a;--line:#4a4336}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;padding:12px}
.board{background:var(--paper);border-radius:26px;padding:14px;max-width:560px;margin:0 auto;box-shadow:0 4px 18px #0003}
#capture{background:var(--paper);padding:8px;border-radius:18px}
h1{font-family:'Aref Ruqaa',serif !important;text-align:center;font-size:32px;font-weight:700;margin:4px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.row{display:flex;gap:4px;margin-bottom:4px}
.lab{width:76px;flex:none;border-radius:4px;color:#fff;font-size:13px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.cells{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cell{background:var(--cell);border:1px solid var(--line);border-radius:4px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0}
.cell.big{grid-column:span 2;aspect-ratio:2/1}
.cell.hot{outline:2px dashed var(--sel)}
.bank{margin-top:12px;background:var(--cell);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:90px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:100%;padding:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:scale(1.1)}
.av{width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;border:2px solid #fff8}
.big .av{max-width:72px}
.card span{font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;gap:6px}
.btns{display:flex;gap:6px}
button.btn{border:0;background:var(--ink);color:var(--paper);border-radius:14px;padding:6px 14px;font-family:inherit;font-weight:700;cursor:pointer}
button.save{background:#4a8f6a;color:#fff}
.copy{text-align:center;font-size:12px;font-weight:700;opacity:.65;margin-top:8px;direction:ltr}
</style>
</head>
<body>
<div class="board">
<div id="capture">
<h1>تصنيف لاعبي كرة القدم</h1>
<div id="rows"></div>
<div class="copy">Witvw</div>
</div>
<div class="bank" id="bank"></div>
<div class="tools">
<span>اسحب اللاعب وأفلته في الخانة</span>
<div class="btns">
<button class="btn save" id="save">حفظ كصورة</button>
<button class="btn" id="reset">إعادة</button>
</div>
</div>
</div>
<script>
const P=[
  {id:"messi",name:"ليونيل ميسي",img:"photo/messi.jpg.JPEG"},
  {id:"mara",name:"دييغو مارادونا",img:"photo/maradona.jpg.JPG"},
  {id:"r9",name:"رونالدو نازاريو",img:"photo/ronaldo.jpg.JPG"},
  {id:"cr7",name:"كريستيانو رونالدو",img:"photo/cr.jpg.JPG"},
  {id:"pele",name:"بيليه",img:"photo/pele.jpg.JPG"},
  {id:"cruyff",name:"يوهان كرويف",img:"photo/johan.jpg.JPG"},
  {id:"zidane",name:"زين الدين زيدان",img:"photo/ziedan.jpg.JPG"},
  {id:"beck",name:"فرانز بيكنباور",img:"photo/binkabowr.jpg.JPG"},
  {id:"difa",name:"ألفريدو دي ستيفانو",img:"photo/de.jpg.jpg"},
  {id:"r10",name:"رونالدينيو",img:"photo/rone.jpg.jpg"},
  {id:"neymar",name:"نيمار جونيور",img:"photo/ney.jpg.JPG"},
  {id:"iniesta",name:"أندريس إنيستا",img:"photo/in.jpg.jpg"},
  {id:"xavi",name:"تشافي هيرنانديز",img:"photo/xavi.jpg.JPG"},
  {id:"modric",name:"لوكا مودريتش",img:"photo/luka.jpg.JPG"}
];
const ROWS=[
  {label:"الأفضل",color:"#8c5a52",count:2},
  {label:"لاعب كبير",color:"#a5714f",count:4},
  {label:"لاعب ممتاز",color:"#8f8a55",count:4},
  {label:"لاعب جيد",color:"#6c8468",count:4}
];
const COL=["#7b5ea7","#c0603a","#3a7ca5","#4a8f6a","#b0488a","#a07d2a","#566","#a14"];
let pos={},photos={},sel=null;
P.forEach(p=>pos[p.id]="b");
const getP=id=>P.find(p=>p.id===id);
function card(id){
  const p=getP(id),ph=photos[id],idx=P.findIndex(x=>x.id===id);
  return `<div class="card${sel===id?' sel':''}" data-id="${id}"><div class="av" style="${ph?`background-image:url('${ph}')`:`background:${COL[idx%COL.length]}`}">${ph?'':p.name.charAt(0)}</div><span>${p.name}</span></div>`;
}
function render(){
  let s=0,h="";
  ROWS.forEach(r=>{
    h+=`<div class="row"><div class="lab" style="background:${r.color}">${r.label}</div><div class="cells">`;
    for(let i=0;i<r.count;i++,s++){
      const id=Object.keys(pos).find(k=>pos[k]===s);
      h+=`<div class="cell${r.count===2?' big':''}" data-slot="${s}">${id?card(id):''}</div>`;
    }
    h+="</div></div>";
  });
  document.getElementById("rows").innerHTML=h;
  document.getElementById("bank").innerHTML=P.filter(p=>pos[p.id]==="b").map(p=>card(p.id)).join("");
}
document.addEventListener("click",e=>{
  const cell=e.target.closest(".cell");
  if(cell&&sel){pos[sel]=+cell.dataset.slot;sel=null;render();return}
  if(e.target.closest("#bank")&&sel){pos[sel]="b";sel=null;render()}
});
let drag=null;
document.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".card");if(!c)return;
  drag={id:c.dataset.id,x:e.clientX,y:e.clientY,g:null,el:c};
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.g){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    const g=drag.el.cloneNode(true);g.className="card ghost";g.style.width=drag.el.offsetWidth+"px";document.body.appendChild(g);drag.g=g;drag.el.style.opacity=.35;
  }
  drag.g.style.left=(e.clientX-drag.g.offsetWidth/2)+"px";drag.g.style.top=(e.clientY-drag.g.offsetHeight/2)+"px";
});
function endDrag(e,drop){
  if(!drag)return;const d=drag;drag=null;
  if(!d.g)return;d.g.remove();
  if(drop){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const tc=t&&t.closest(".card"),cell=t&&t.closest(".cell"),bank=t&&t.closest("#bank");
    if(tc&&tc.dataset.id!==d.id){const o=tc.dataset.id,tmp=pos[d.id];pos[d.id]=pos[o];pos[o]=tmp}
    else if(cell&&!tc)pos[d.id]=+cell.dataset.slot;
    else if(bank&&!tc)pos[d.id]="b";
  }
  render();
}
document.addEventListener("pointerup",e=>endDrag(e,true));
document.addEventListener("pointercancel",e=>endDrag(e,false));
document.getElementById("reset").onclick=()=>{P.forEach(p=>pos[p.id]="b");sel=null;render()};
document.getElementById("save").onclick=async()=>{
  const btn=document.getElementById("save");
  btn.textContent="جاري الحفظ...";
  try{
    await document.fonts.ready;
    const canvas=await html2canvas(document.getElementById("capture"),{scale:2,useCORS:true,backgroundColor:null});
    canvas.toBlob(async blob=>{
      const file=new File([blob],"Witvw-tierlist.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"تصنيف لاعبي كرة القدم"})}catch(e){}
      }else{
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.download="Witvw-tierlist.png";
        a.href=url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
      }
      btn.textContent="حفظ كصورة";
    },"image/png");
  }catch(e){
    btn.textContent="حفظ كصورة";
  }
};
P.forEach(p=>{
  const im=new Image();
  im.onload=()=>{photos[p.id]=p.img;render()};
  im.src=p.img;
});
render();
</script>
</body>
</html>
